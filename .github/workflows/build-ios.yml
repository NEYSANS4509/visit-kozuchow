name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # Ручной запуск из вкладки Actions на GitHub
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.txt'
      - '*.md'
      - '.gitignore'

jobs:
  build-ios:
    name: 🍎 Build Unsigned IPA on macOS
    runs-on: macos-15
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: ⚙️ Generate iOS Native Project (Expo Prebuild)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_GROQ_API_KEY: ${{ secrets.EXPO_PUBLIC_GROQ_API_KEY }}
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔨 Ensure CocoaPods are installed
        run: |
          cd ios
          if [ ! -d "Pods" ]; then
            pod install --repo-update
          fi
          cd ..

      - name: 🍏 Build Unsigned iOS Release Archive
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 1 | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 📦 Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r VisitKozuchow_unsigned.ipa Payload/
          echo "Created IPA:"
          ls -lh VisitKozuchow_unsigned.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisitKozuchow-iOS-Unsigned
          path: VisitKozuchow_unsigned.ipa
          retention-days: 14
